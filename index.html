<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Мои языки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&family=Noto+Sans:wght@400&display=swap">
<style>
/* Layout: pearl page with lilac mist; hero card pairs the portrait (with a glass progress medallion) with title and stat tiles. Palette sampled from the UI-kit. */
:root{
  --bg:#FEF9FC; --sky1:#E3D9EC; --sky2:#F1E3E5; --sky3:#E5D6E4;
  --ink:#533B47; --ink-soft:#8A7482; --line:rgba(150,120,155,.22);
  --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.85);
  --btn-a:#BE8EA0; --btn-b:#9A8AB9; --btn-ink:#FFFFFF;
  --badge-a:#E2D5E6; --badge-b:#BBA9D2; --badge-ink:#FFFFFF;
  --accent:#A87A8F; --lilac:#D6C8DC; --gold:#E0B48C;
  --ok:#5E8F7C; --ok-bg:rgba(110,170,145,.18); --mid:#8E7BB5; --mid-bg:rgba(142,123,181,.17); --new:#9A8798; --new-bg:rgba(154,135,152,.17);
  --bad:#B0634F; --star:rgba(255,255,255,.98);
  --shadow:0 12px 30px rgba(160,125,170,.2);
  --display:"Cormorant Garamond","Cormorant",Georgia,serif;
  --body:"Jost","Segoe UI",system-ui,sans-serif;
  --ipa:"Noto Sans","Segoe UI","DejaVu Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1424; --sky1:#2E2444; --sky2:#40293F; --sky3:#27254A;
  --ink:#F4E9F0; --ink-soft:#BCA9B8; --line:rgba(230,200,235,.18);
  --glass:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.13);
  --btn-a:#E8BCCB; --btn-b:#B9A8E3; --btn-ink:#2A1B30;
  --badge-a:#6B5A92; --badge-b:#4A3C70; --badge-ink:#FFFFFF;
  --accent:#E8B9CC; --lilac:#8A78B8; --gold:#E8C79B;
  --ok:#8FD0B3; --ok-bg:rgba(120,200,170,.16); --mid:#B9A9EA; --mid-bg:rgba(160,140,220,.18); --new:#BCA9B8; --new-bg:rgba(188,169,184,.14);
  --bad:#F0A58F; --star:rgba(255,255,255,.9);
  --shadow:0 12px 30px rgba(0,0,0,.38); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1424; --sky1:#2E2444; --sky2:#40293F; --sky3:#27254A;
  --ink:#F4E9F0; --ink-soft:#BCA9B8; --line:rgba(230,200,235,.18);
  --glass:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.13);
  --btn-a:#E8BCCB; --btn-b:#B9A8E3; --btn-ink:#2A1B30;
  --badge-a:#6B5A92; --badge-b:#4A3C70; --badge-ink:#FFFFFF;
  --accent:#E8B9CC; --lilac:#8A78B8; --gold:#E8C79B;
  --ok:#8FD0B3; --ok-bg:rgba(120,200,170,.16); --mid:#B9A9EA; --mid-bg:rgba(160,140,220,.18); --new:#BCA9B8; --new-bg:rgba(188,169,184,.14);
  --bad:#F0A58F; --star:rgba(255,255,255,.9);
  --shadow:0 12px 30px rgba(0,0,0,.38); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink); font:400 16px/1.55 var(--body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  position:relative; overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(60% 45% at 12% 8%,var(--sky1),transparent 70%),
    radial-gradient(55% 40% at 92% 22%,var(--sky2),transparent 70%),
    radial-gradient(70% 50% at 40% 100%,var(--sky3),transparent 70%),
    var(--bg);}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
.shell{max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.ipa{font-family:var(--ipa);font-size:.92em;color:var(--ink-soft);letter-spacing:.01em}

/* section nav */
.sections{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.sections::-webkit-scrollbar{display:none}
.sections span,.sections b{flex:none;padding:8px 16px;border-radius:999px;font-size:14px;letter-spacing:.02em;white-space:nowrap}
.sections span{color:var(--ink-soft);border:1px solid var(--line);background:var(--glass)}
.sections b{font-weight:500;color:var(--btn-ink);background:linear-gradient(135deg,var(--btn-a),var(--btn-b));box-shadow:var(--shadow)}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;padding:28px;border-radius:28px;
  background:linear-gradient(150deg,var(--glass-hi),var(--glass));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hero>*{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.hero h1{font-size:clamp(40px,7vw,64px);line-height:1.02;margin:6px 0 8px}
.hero p.lead{color:var(--ink-soft);max-width:44ch}
.langs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:var(--glass);margin-top:18px}
.langs button{border:0;background:none;padding:8px 18px;border-radius:999px;color:var(--ink-soft);font-weight:500;letter-spacing:.03em}
.langs button[aria-pressed="true"]{background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:var(--btn-ink)}
.orb{position:relative;width:208px;height:208px;display:grid;place-items:center}
.orb svg{position:absolute;inset:0;width:100%;height:100%}
.orb .core{position:relative;text-align:center;line-height:1}
.orb .pct{font-family:var(--display);font-size:50px;font-weight:500}
.orb .cap{display:block;margin-top:6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:13px;border:1px solid transparent}
.chip b{font-weight:500;font-variant-numeric:tabular-nums}
.chip.new{background:var(--new-bg);color:var(--new)}
.chip.learning{background:var(--mid-bg);color:var(--mid)}
.chip.learned{background:var(--ok-bg);color:var(--ok)}
.chip.due{background:transparent;border-color:var(--line);color:var(--ink-soft)}

/* tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:0;background:none;padding:12px 18px;color:var(--ink-soft);font-size:16px;letter-spacing:.02em;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:500}

/* generic */
.panel{border-radius:22px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;padding:11px 22px;border-radius:999px;font-weight:500;letter-spacing:.02em;color:var(--btn-ink);background:linear-gradient(135deg,var(--btn-a),var(--btn-b));box-shadow:0 6px 16px rgba(130,100,170,.25)}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:7px 14px;font-size:14px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--glass);color:var(--accent);flex:none}
.icon-btn:hover{background:var(--glass-hi)}
.icon-btn svg{width:18px;height:18px}
.empty{text-align:center;color:var(--ink-soft);padding:40px 16px}
.empty h3{font-size:26px;color:var(--ink);margin-bottom:6px}

/* words */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 200px;min-width:0}
input[type=text],input[type=search],textarea,select{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass-hi);outline-offset:1px}
textarea{resize:vertical;min-height:64px}
::placeholder{color:var(--ink-soft);opacity:.75}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--glass);padding:7px 14px;border-radius:999px;color:var(--ink-soft);font-size:14px}
.filters button[aria-pressed="true"]{background:var(--glass-hi);color:var(--ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.word{display:flex;flex-direction:column;gap:10px;min-width:0}
.word .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.word h3{font-size:30px;line-height:1.1;overflow-wrap:anywhere}
.word .tr{font-size:17px}
.word .pos{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.word ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.word li{display:flex;gap:8px;align-items:flex-start;padding-left:12px;border-left:2px solid var(--lilac)}
.word li div{min-width:0;flex:1}
.word li small{display:block;color:var(--ink-soft);font-size:14px}
.word .media{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.word .media img{max-width:100%;max-height:160px;border-radius:14px;object-fit:cover}
.word .media audio{max-width:100%;height:36px}
.word .foot{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.status{border:0;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500}
.status.new{background:var(--new-bg);color:var(--new)}
.status.learning{background:var(--mid-bg);color:var(--mid)}
.status.learned{background:var(--ok-bg);color:var(--ok)}
.tools{display:flex;gap:6px}
.tag-ex{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}

/* form */
.form{display:grid;gap:14px}
.form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);min-width:0}
.form label input,.form label select,.form label textarea{text-transform:none;letter-spacing:0;font-size:16px;color:var(--ink)}
.exrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.exrow>*{min-width:0}
.form .actions{display:flex;gap:10px;flex-wrap:wrap}
.filebtn{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;border:1px dashed var(--line);background:var(--glass);font-size:14px;color:var(--ink-soft);cursor:pointer;text-transform:none;letter-spacing:0}
.filebtn input{display:none}

/* flashcards */
.deckbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.stage{display:grid;place-items:center;padding:8px 0}
.flip{perspective:1200px;width:min(520px,100%);height:340px}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;overflow:auto;
  background:linear-gradient(160deg,var(--glass-hi),var(--glass));border:1px solid var(--line);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg)}
.face h2{font-size:clamp(38px,8vw,54px);line-height:1.05;overflow-wrap:anywhere}
.face .hint{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.face .sent{font-style:italic;font-family:var(--display);font-size:21px;line-height:1.3}
.face .sent small{display:block;font-family:var(--body);font-style:normal;font-size:14px;color:var(--ink-soft);margin-top:2px}
.rate{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.progressline{height:6px;border-radius:99px;background:var(--line);overflow:hidden;width:min(520px,100%);margin:0 auto}
.progressline i{display:block;height:100%;background:linear-gradient(90deg,var(--btn-a),var(--btn-b));border-radius:99px;transition:width .3s}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;padding:20px;border-radius:22px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shadow);color:var(--ink)}
.mode:hover:not(:disabled){background:var(--glass-hi)}
.mode:disabled{opacity:.5;cursor:default}
.mode h3{font-size:26px}
.mode p{color:var(--ink-soft);font-size:15px}
.quiz{display:flex;flex-direction:column;gap:18px;max-width:640px;margin-inline:auto;width:100%}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;color:var(--ink-soft)}
.qbox{padding:26px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(160deg,var(--glass-hi),var(--glass));box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.qbox h2{font-size:clamp(34px,7vw,46px);overflow-wrap:anywhere}
.qbox .sent{font-family:var(--display);font-style:italic;font-size:24px;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:var(--glass);text-align:left;font-size:17px}
.opt:hover:not(:disabled){background:var(--glass-hi)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad)}
.answer{display:flex;gap:10px;flex-wrap:wrap}
.answer input{flex:1 1 200px;font-size:18px}
.fb{min-height:26px;text-align:center;font-weight:500}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result h2{font-size:48px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;z-index:20;max-width:90vw}

@media (max-width:640px){
  .hero{grid-template-columns:1fr;padding:22px;text-align:left}
  .orb{justify-self:center;width:180px;height:180px}
  .orb .pct{font-size:42px}
  .exrow{grid-template-columns:1fr auto}
  .exrow input:nth-child(2){grid-column:1}
  .flip{height:380px}
}
@media (prefers-reduced-motion:reduce){.flip .inner,.progressline i{transition:none}}

/* ---- UI-kit refresh ---- */
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-btn{width:40px;height:40px;border:0;color:var(--badge-ink);
  background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.55),transparent 55%),linear-gradient(145deg,var(--badge-a),var(--badge-b));
  box-shadow:0 6px 14px rgba(150,120,185,.28),inset 0 0 0 1px rgba(255,255,255,.35)}
.icon-btn .ic{filter:drop-shadow(0 0 4px rgba(255,255,255,.85))}
.icon-btn:hover{filter:brightness(1.06);background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.55),transparent 55%),linear-gradient(145deg,var(--badge-a),var(--badge-b))}
.hero2 h1,.face h2,.qbox h2{font-weight:400}
.hero2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:stretch;padding:24px;border-radius:30px;
  background:linear-gradient(150deg,var(--glass-hi),var(--glass));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hero2>*{min-width:0}
.htext{display:flex;flex-direction:column;gap:6px;justify-content:center}
.hero2 h1{font-size:clamp(42px,7vw,68px);line-height:1.02;margin:4px 0 6px}
.hero2 .lead{color:var(--ink-soft);max-width:46ch}
.hero2 .langs{align-self:flex-start;margin-top:14px}
.portrait{position:relative;margin:0;border-radius:26px;overflow:hidden;min-height:340px;box-shadow:0 14px 34px rgba(150,120,185,.32);background:var(--sky1)}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.portrait::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);pointer-events:none}
.medal{position:absolute;left:14px;bottom:14px;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 22px rgba(120,90,160,.3),inset 0 0 0 1px rgba(255,255,255,.6)}
.medal svg{position:absolute;inset:0;width:100%;height:100%}
.medal .core{position:relative;text-align:center;line-height:1;color:#4A3342}
.medal .pct{font-family:var(--display);font-size:32px;font-weight:500}
.medal .cap{display:block;margin-top:3px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px 12px;border-radius:20px;text-align:center;
  background:linear-gradient(165deg,var(--sky1),var(--sky2));border:1px solid var(--line);box-shadow:0 8px 18px rgba(160,125,170,.14)}
.tile .ic{width:20px;height:20px;color:var(--accent);filter:drop-shadow(0 0 4px rgba(255,255,255,.9))}
.tile .n{font-family:var(--display);font-size:38px;font-weight:400;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.tiles .due{grid-column:1/-1;font-size:14px;color:var(--ink-soft)}
.tiles .due b{font-weight:500;color:var(--ink)}
.tabs button{display:inline-flex;align-items:center;gap:8px}
.tabs .ic{width:18px;height:18px}
.searchbox{position:relative;flex:1 1 200px;min-width:0}
.searchbox input{padding-left:42px}
.searchbox .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--accent);pointer-events:none}
.status{display:inline-flex;align-items:center;gap:6px}
.status .ic{width:15px;height:15px}
@media (max-width:760px){
  .hero2{grid-template-columns:1fr;padding:18px;gap:18px}
  .portrait{order:-1;min-height:0;aspect-ratio:4/4.2;max-height:420px}
  .portrait img{object-position:50% 22%}
  .medal{width:112px;height:112px;left:10px;bottom:10px}
  .medal .pct{font-size:28px}
}

[hidden]{display:none!important}
/* ---- planning ---- */
.secwrap{display:flex;flex-direction:column;gap:22px}
.sections button{flex:none;padding:8px 16px;border-radius:999px;font-size:14px;letter-spacing:.02em;white-space:nowrap;color:var(--ink-soft);border:1px solid var(--line);background:var(--glass)}
.sections button[aria-current="page"]{font-weight:500;color:var(--btn-ink);background:linear-gradient(135deg,var(--btn-a),var(--btn-b));box-shadow:var(--shadow);border-color:transparent}
input[type=date],input[type=time],input[type=number]{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass-hi);min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.two>*{min-width:0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rt span{overflow-wrap:anywhere}
.row small{color:var(--ink-soft);font-size:13px}
.row.done .rt span{text-decoration:line-through;color:var(--ink-soft)}
.check{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);background:var(--glass-hi);display:grid;place-items:center;flex:none;color:#fff;padding:0}
.check.on{background:linear-gradient(145deg,var(--btn-a),var(--btn-b));border-color:transparent}
.check .ic{width:16px;height:16px;stroke-width:2.4}
.check:disabled{opacity:.4;cursor:default}
.quick{display:flex;gap:10px;margin-bottom:8px}
.quick input{flex:1;min-width:0}
.sectitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.sectitle h2{font-size:30px}
.sectitle small{color:var(--ink-soft)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--btn-a),var(--btn-b))}
.goal{display:flex;flex-direction:column;gap:12px;min-width:0}
.goal.finished{opacity:.85}
.goal h3{font-size:28px;line-height:1.1;overflow-wrap:anywhere}
.goal .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.area{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.a-health{background:rgba(120,200,170,.28)}.a-growth{background:rgba(160,140,220,.28)}.a-work{background:rgba(130,160,220,.28)}.a-money{background:rgba(224,180,140,.38)}.a-love{background:rgba(230,150,180,.3)}.a-home{background:rgba(200,170,150,.32)}.a-art{background:rgba(200,150,220,.3)}
.gmeta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink-soft);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:center}
.steps li span{min-width:0;overflow-wrap:anywhere}
.steps li.done span{text-decoration:line-through;color:var(--ink-soft)}
.counter{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.counter b{font-family:var(--display);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums}
.goalfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.habit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.habit h3{font-size:24px;overflow-wrap:anywhere}
.week{display:flex;gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.day .check{width:30px;height:30px}
.day.today span{color:var(--accent);font-weight:500}
.streak{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-soft)}
.streak .ic{width:15px;height:15px;color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{text-align:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:4px 0}
.cell{min-height:56px;border-radius:14px;border:1px solid transparent;background:var(--glass);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-variant-numeric:tabular-nums;color:var(--ink)}
.cell.out{opacity:.45}
.cell.today{border-color:var(--accent)}
.cell.sel{background:linear-gradient(145deg,var(--btn-a),var(--btn-b));color:var(--btn-ink)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.g{background:var(--gold)}
.cell.sel .dots i{background:var(--btn-ink)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.calhead h2{font-size:30px;text-transform:capitalize}
.calhead .nav{display:flex;gap:8px;align-items:center}
.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--bad)}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-top:14px}
.addrow input[type=text]{grid-column:1/-1}
.addrow>*{min-width:0}
.linkbtn{background:none;border:0;color:var(--ink-soft);text-decoration:underline;font-size:14px;padding:4px}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--gold);flex:none}
@media (max-width:640px){
  .habit{grid-template-columns:1fr}
  .week{justify-content:space-between}
  .cell{min-height:46px;padding:4px 1px}
}

/* ---- notes ---- */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.note{display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left;cursor:pointer;color:var(--ink)}
.note:hover{background:var(--glass-hi)}
.note .nt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.note h3{font-size:26px;line-height:1.12;overflow-wrap:anywhere}
.note .nb{color:var(--ink-soft);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
.note .nf{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-top:auto;flex-wrap:wrap}
.pinbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink-soft);display:grid;place-items:center;flex:none;padding:0}
.pinbtn .ic{width:16px;height:16px}
.pinbtn[aria-pressed="true"]{color:var(--btn-ink);border-color:transparent;background:linear-gradient(135deg,var(--btn-a),var(--btn-b))}
.nhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.nstatus{font-size:13px;color:var(--ink-soft)}
.nstatus.err{color:var(--bad)}
#n-body{min-height:260px;line-height:1.6;font-size:17px;resize:vertical}
.form .actions .grow{margin-left:auto}
a.btn{text-decoration:none}
.ncover{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;display:block}
.ntags{display:flex;gap:6px;flex-wrap:wrap}
.ntags span{font-size:12px;color:var(--accent);background:var(--glass-hi);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
.nphoto{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.nph-img{aspect-ratio:1/1;border-radius:18px;border:1px dashed var(--line);background:var(--glass);display:grid;place-items:center;overflow:hidden;color:var(--ink-soft);font-size:13px;text-align:center;padding:6px}
.nph-img img{width:100%;height:100%;object-fit:cover;display:block;margin:-6px}
.nph-side{display:flex;flex-direction:column;gap:8px;min-width:0}
.nph-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nph-side small{color:var(--ink-soft)}
.rich{font-size:17px;line-height:1.65;min-height:140px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--glass-hi)}
.rich h4{font-family:var(--display);font-size:26px;font-weight:500;margin:16px 0 6px}
.rich h4:first-child{margin-top:0}
.rich p{margin:6px 0;overflow-wrap:anywhere}
.rich ul,.rich ol{margin:6px 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
@media (max-width:560px){.nphoto{grid-template-columns:1fr}.nph-img{aspect-ratio:16/9}}
.form label.filebtn{flex-direction:row;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink-soft)}
</style>

/* ---------- storage: shared db when available, local fallback otherwise ---------- */
let queue=Promise.resolve();
const enqueue=fn=>{queue=queue.then(fn,fn);return queue};
function saveLocal(){try{localStorage.setItem("lang_words_v1",JSON.stringify(S.words))}catch(e){}}
function useLocal(){
  S.db=null;let list=null;
  try{list=JSON.parse(localStorage.getItem("lang_words_v1")||"null")}catch(e){}
  const mk=(w,i)=>Object.assign({id:newId(),status:"new",box:0,due:"",added:Date.now()-i,reviewed:0,img:"",aud:""},w);
  if(!Array.isArray(list))list=SAMPLES.map(mk);
  else{
    let seeded="";try{seeded=localStorage.getItem("lang_seed_v3")||""}catch(e){}
    if(!seeded){const have=new Set(list.map(w=>w.lang+"|"+norm(w.word)));SAMPLES.forEach((w,i)=>{if(!have.has(w.lang+"|"+norm(w.word)))list.push(mk(w,i))})}
  }
  try{localStorage.setItem("lang_seed_v3","1")}catch(e){}
  S.words=list;S.ready=true;saveLocal();renderAll();
}
function dbWrite(op,id,data){
  return enqueue(async()=>{
    try{
      if(S.db){
        const ref=S.db.collection("words").doc(id);
        if(op==="set")await ref.set(data);
        else if(op==="update")await ref.update(data);
        else await ref.delete();
      }else{
        const i=S.words.findIndex(w=>w.id===id);
        if(op==="set"){const w=Object.assign({id},data);if(i>=0)S.words[i]=w;else S.words.push(w)}
        else if(op==="update"&&i>=0)S.words[i]=Object.assign({},S.words[i],data);
        else if(op==="delete"&&i>=0)S.words.splice(i,1);
        saveLocal();renderAll();

}

const langWords=()=>S.words.filter(w=>w.lang===S.lang);
function counts(){
  const L=langWords(),t=today();
  return{total:L.length,
    new:L.filter(w=>w.status==="new").length,
    learning:L.filter(w=>w.status==="learning").length,
    learned:L.filter(w=>w.status==="learned").length,
    due:L.filter(w=>w.status!=="new"&&w.due&&w.due<=t).length};
}
function applyGrade(w,ok){
  let box=w.box||0;
  box=ok?Math.min(5,box+1):1;
  return{box,status:box>=4?"learned":"learning",due:addDays(INTERVALS[box]),reviewed:Date.now()};
}
function setManual(w,status){
  if(status==="learned")return{status,box:5,due:addDays(INTERVALS[5])};
  if(status==="learning")return{status,box:Math.max(1,w.box||0),due:today()};
  return{status:"new",box:0,due:""};
}

/* ---------- sky of sparkles ---------- */
function drawSky(){
  const c=$("#sky");if(!c)return;
  const dpr=Math.min(2,window.devicePixelRatio||1),w=innerWidth,h=innerHeight;
  c.width=w*dpr;c.height=h*dpr;
  const x=c.getContext("2d");x.scale(dpr,dpr);x.clearRect(0,0,w,h);
  const cs=getComputedStyle(document.documentElement);
  const star=cs.getPropertyValue("--star").trim()||"#fff",glow=cs.getPropertyValue("--lilac").trim()||"#cfc4e8";
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
  const n=Math.round(Math.min(90,w*h/14000));
  x.fillStyle=star;x.shadowColor=glow;
  for(let i=0;i<n;i++){
    const px=rnd()*w,py=rnd()*h,r=.6+rnd()*1.6,big=rnd()>.86;
    x.globalAlpha=.35+rnd()*.6;x.shadowBlur=big?14:7;
    if(big){
      const s=5+rnd()*7;x.beginPath();
      x.moveTo(px,py-s);x.quadraticCurveTo(px,py,px+s,py);x.quadraticCurveTo(px,py,px,py+s);
      x.quadraticCurveTo(px,py,px-s,py);x.quadraticCurveTo(px,py,px,py-s);x.fill();
    }else{x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill()}
  }
}

  collectDraft();const d=S.draft;

/* ---------- flashcards ---------- */
S.cardDir="fw";
const DECKS=[["due","Повторить сегодня","пришло время вспомнить"],["new","Новые","ещё не открывали"],["learning","В процессе","уже знакомы, но не закреплены"],["all","Все слова","весь словарь"]];
function deckIds(deck){
  const t=today(),L=langWords();
  const f={due:w=>w.status!=="new"&&w.due&&w.due<=t,new:w=>w.status==="new",learning:w=>w.status==="learning",all:()=>true}[deck];
  return L.filter(f).map(w=>w.id);
}
const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return m>10&&m<20?c:k===1?a:k>=2&&k<=4?b:c};
function startCards(deck){
  const ids=shuffle(deckIds(deck));if(!ids.length)return;
  S.sessionCards={active:true,deck,queue:ids,total:ids.length,done:0,known:0,again:0,missed:new Set()};
  renderCards();
}
function faceHtml(w,side){
  const front=S.cardDir==="fw"?"word":"tr";
  const isWord=(side==="front")===(front==="word");
  const ex=(w.ex||[])[0];
  const body=isWord
    ?'<div class="hint">'+LANG[w.lang].name+'</div><h2 lang="'+w.lang+'">'+esc(w.word)+'</h2>'+(w.ipa?'<div class="ipa">'+esc(w.ipa)+'</div>':'')
    :'<div class="hint">Перевод</div><h2>'+esc(w.tr)+'</h2>'+(w.pos?'<div class="ipa">'+esc(w.pos)+'</div>':"");
  const sent=side==="back"&&ex?'<div class="sent">'+esc(ex.t)+(ex.tr?'<small>'+esc(ex.tr)+'</small>':"")+'</div>':"";
  return '<div class="face '+side+'">'+body+sent+'</div>';
}
function renderCards(){
  const v=$("#view-cards"),s=S.sessionCards;
  if(!s){
    const dirs=[["fw","Слово → перевод"],["bw","Перевод → слово"]];
    v.innerHTML='<div class="panel" style="display:flex;flex-direction:column;gap:20px"><div><h2 style="font-size:36px">Карточки</h2>'+
      '<p style="color:var(--ink-soft);max-width:52ch">Выберите набор. Слова, которые вы знаете, возвращаются всё реже, а трудные — чаще.</p></div>'+
      '<div class="modes">'+DECKS.map(d=>{const n=deckIds(d[0]).length;
        return '<button type="button" class="mode" data-deck="'+d[0]+'"'+(n?"":" disabled")+'><h3>'+d[1]+'</h3><p>'+n+' '+plural(n,"слово","слова","слов")+' · '+d[2]+'</p></button>'}).join("")+'</div>'+
      '<div class="filters" role="group" aria-label="Направление">'+dirs.map(d=>'<button type="button" data-dir="'+d[0]+'" aria-pressed="'+(S.cardDir===d[0])+'">'+d[1]+'</button>').join("")+'</div></div>';
    return;
  }
  if(!s.active){
    v.innerHTML='<div class="panel result"><h2>Готово</h2><p style="color:var(--ink-soft)">Вы прошли '+s.total+' '+plural(s.total,"карточку","карточки","карточек")+'. Вспомнили сразу: '+(s.total-s.missed.size)+', вернулись к: '+s.missed.size+'.</p>'+
      '<div class="rate"><button type="button" class="btn" data-act="again">Ещё набор</button><button type="button" class="btn ghost" data-act="towords">К словарю</button></div></div>';
    return;
  }
  const w=S.words.find(x=>x.id===s.queue[0]);
  if(!w){s.queue.shift();if(!s.queue.length)s.active=false;renderCards();return}
  const pct=Math.round(s.done/s.total*100);
  v.innerHTML='<div class="stage" style="display:flex;flex-direction:column;gap:16px"><div class="qhead" style="width:min(520px,100%)"><span>Осталось '+s.queue.length+'</span><button type="button" class="btn ghost small" data-act="endsession">Закончить</button></div>'+
    '<div class="progressline" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+
    '<div class="flip" id="flip" role="button" tabindex="0" aria-label="Перевернуть карточку"><div class="inner">'+faceHtml(w,"front")+faceHtml(w,"back")+'</div></div>'+
    '<button type="button" class="btn" id="showBtn">Показать ответ</button>'+
    '<div class="rate" id="rate" hidden style="margin-top:0"><button type="button" class="btn ghost" data-rate="0">Ещё учу</button><button type="button" class="btn" data-rate="1">Знаю</button></div></div>';
}
function flipCard(){
  const f=$("#flip");if(!f||f.classList.contains("on"))return;
  f.classList.add("on");$("#showBtn").hidden=true;$("#rate").hidden=false;
  const r=$("#rate .btn:last-child");if(r)r.focus({preventScroll:true});
}
function rateCard(ok){
  const s=S.sessionCards;if(!s||!s.active)return;
  const id=s.queue.shift(),w=S.words.find(x=>x.id===id);
  if(w){
    if(ok){if(!s.missed.has(id))patchWord(id,applyGrade(w,true));s.done++;s.known++}
    else{if(!s.missed.has(id))patchWord(id,applyGrade(w,false));s.missed.add(id);s.queue.push(id);s.again++}
  }else s.done++;
  if(!s.queue.length)s.active=false;
  renderCards();
}
$("#view-cards").addEventListener("click",e=>{
  const t=e.target;
  const dk=t.closest("[data-deck]");if(dk){startCards(dk.dataset.deck);return}
  const dr=t.closest("[data-dir]");if(dr){S.cardDir=dr.dataset.dir;renderCards();return}
  const rt=t.closest("[data-rate]");if(rt){rateCard(rt.dataset.rate==="1");return}
  if(t.closest("#showBtn")||t.closest("#flip")){flipCard();return}
  const a=t.closest("[data-act]");if(!a)return;

/* ---------- practice ---------- */
const MODES=[
  ["choice","Выбери перевод","Слово на экране, четыре варианта ответа.",2],
  ["type","Впиши слово","Перевод на экране, слово нужно написать.",1],
  ["cloze","Пропуск в предложении","Вставьте пропущенное слово в своё предложение.",1]
];
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function clozeOf(w){
  const re=new RegExp("(^|[^\\p{L}])("+escRe(w.word)+")(?=$|[^\\p{L}])","iu");
  return(w.ex||[]).find(e=>re.test(e.t))||null;
}
function poolFor(mode){
  let L=langWords();
  if(mode==="cloze")L=L.filter(clozeOf);
  const order={new:0,learning:0,learned:1};
  return shuffle(L).sort((a,b)=>order[a.status]-order[b.status]);
}
function startQuiz(mode){
  const pool=poolFor(mode).slice(0,10);
  const need=MODES.find(m=>m[0]===mode)[3];
  if(pool.length<need){toast(mode==="cloze"?"Добавьте слова с предложениями":"Добавьте больше слов")}
  if(pool.length<need)return;
  S.quiz={active:true,mode,ids:pool.map(w=>w.id),i:0,score:0,answered:false,misses:[],ok:null,note:""};
  renderPractice();
}
function renderPractice(){
  const v=$("#view-practice"),q=S.quiz;
  if(!q){
    v.innerHTML='<div class="panel" style="display:flex;flex-direction:column;gap:20px"><div><h2 style="font-size:36px">Упражнения</h2><p style="color:var(--ink-soft);max-width:52ch">В каждом раунде до десяти слов, сначала те, что вы ещё не выучили.</p></div>'+
      '<div class="modes">'+MODES.map(m=>{const n=poolFor(m[0]).length;
        return '<button type="button" class="mode" data-mode="'+m[0]+'"'+(n<m[3]?" disabled":"")+'><h3>'+m[1]+'</h3><p>'+m[2]+'</p></button>'}).join("")+'</div></div>';
    return;
  }
  if(!q.active){
    const miss=q.misses.map(id=>S.words.find(x=>x.id===id)).filter(Boolean);
    v.innerHTML='<div class="panel result"><h2>'+q.score+' из '+q.ids.length+'</h2><p style="color:var(--ink-soft)">'+(miss.length?"Эти слова вернутся в повторение:":"Без ошибок. Отличный раунд.")+'</p>'+
      (miss.length?'<ul style="list-style:none;padding:0;margin:0;display:grid;gap:6px">'+miss.map(w=>'<li><b style="font-weight:500">'+esc(w.word)+'</b> <span style="color:var(--ink-soft)">— '+esc(w.tr)+'</span></li>').join("")+'</ul>':"")+
      '<div class="rate"><button type="button" class="btn" data-act="qagain">Ещё раунд</button><button type="button" class="btn ghost" data-act="qmodes">Другое упражнение</button></div></div>';
    return;
  }
  const w=S.words.find(x=>x.id===q.ids[q.i]);
  if(!w){q.i++;if(q.i>=q.ids.length)q.active=false;renderPractice();return}
  let body="",foot="";
  if(q.mode==="choice"){
    if(!q.opts){
      const others=shuffle(langWords().filter(x=>x.id!==w.id&&norm(x.tr)!==norm(w.tr))).slice(0,3).map(x=>x.tr);
      q.opts=shuffle([w.tr].concat(others));
    }
    body='<div class="qbox"><div class="tag-ex">Что значит это слово?</div><h2 lang="'+w.lang+'">'+esc(w.word)+'</h2>'+(w.ipa?'<div class="ipa">'+esc(w.ipa)+'</div>':"")+'</div>'+
      '<div class="opts">'+q.opts.map((o,k)=>{
        let cls="opt";if(q.answered){if(o===w.tr)cls+=" right";else if(o===q.picked)cls+=" wrong"}
        return '<button type="button" class="'+cls+'" data-opt="'+k+'"'+(q.answered?" disabled":"")+'>'+esc(o)+'</button>'}).join("")+'</div>';
  }else{
    let prompt="";
    if(q.mode==="type")prompt='<div class="tag-ex">Напишите слово</div><h2>'+esc(w.tr)+'</h2>'+(w.pos?'<div class="ipa">'+esc(w.pos)+'</div>':"");
    else if(q.mode==="cloze"){
      const e=clozeOf(w),re=new RegExp("(^|[^\\p{L}])("+escRe(w.word)+")(?=$|[^\\p{L}])","iu");
      prompt='<div class="tag-ex">Вставьте пропущенное слово</div><div class="sent">'+esc(e.t).replace(re,(m,p1)=>p1+'<span style="border-bottom:2px solid var(--accent);display:inline-block;min-width:3.5em">&nbsp;</span>')+'</div>'+
        '<div style="color:var(--ink-soft)">'+esc(e.tr||w.tr)+'</div>';
    }else prompt="";
    body='<div class="qbox">'+prompt+'</div>'+
      '<form class="answer" id="qform" autocomplete="off"><input type="text" id="qans" aria-label="Ваш ответ" autocapitalize="none" spellcheck="false"'+(q.answered?" disabled":"")+' value="'+esc(q.typed||"")+'"><button type="submit" class="btn"'+(q.answered?" hidden":"")+'>Проверить</button></form>';
  }
  if(q.answered){
    foot='<div class="fb '+(q.ok?"ok":"bad")+'">'+(q.ok?"Верно":"Правильно: "+esc(w.word))+(q.note?" · "+esc(q.note):"")+'</div>'+
      '<div class="rate" style="margin-top:0"><button type="button" class="btn" data-act="qnext" id="qnext">'+(q.i+1>=q.ids.length?"Результат":"Дальше")+'</button></div>';
  }else foot='<div class="fb"></div>';
  v.innerHTML='<div class="quiz"><div class="qhead"><span>Вопрос '+(q.i+1)+' из '+q.ids.length+'</span><button type="button" class="btn ghost small" data-act="qend">Закончить</button></div>'+
    '<div class="progressline" style="width:100%"><i style="width:'+Math.round(q.i/q.ids.length*100)+'%"></i></div>'+body+foot+'</div>';
  const f=q.answered?$("#qnext"):$("#qans");if(f)f.focus({preventScroll:true});
}
function answerQuiz(ok,picked,typed,note){
  const q=S.quiz;if(!q||q.answered)return;
  const id=q.ids[q.i],w=S.words.find(x=>x.id===id);
  q.answered=true;q.ok=ok;q.picked=picked;q.typed=typed||"";q.note=note||"";
  if(ok)q.score++;else q.misses.push(id);
  if(w){
    const due=w.status==="new"||(w.due&&w.due<=today());
    if(!ok||due)patchWord(id,applyGrade(w,ok));
  }
  renderPractice();
}
function checkTyped(){
  const q=S.quiz,w=S.words.find(x=>x.id===q.ids[q.i]);if(!w)return;
  const val=$("#qans").value.trim();if(!val){$("#qans").focus();return}
  const ok=norm(val)===norm(w.word);
  const note=ok&&val.toLowerCase()!==w.word.toLowerCase()?"пишется «"+w.word+"»":"";
  answerQuiz(ok,null,val,note);
}
function nextQuiz(){
  const q=S.quiz;q.i++;q.answered=false;q.opts=null;q.typed="";q.note="";q.picked=null;
  if(q.i>=q.ids.length)q.active=false;
  renderPractice();
}
$("#view-practice").addEventListener("click",e=>{
  const t=e.target,q=S.quiz;
  const m=t.closest("[data-mode]");if(m){startQuiz(m.dataset.mode);return}
  const o=t.closest("[data-opt]");
  if(o&&q&&!q.answered){const w=S.words.find(x=>x.id===q.ids[q.i]),val=q.opts[+o.dataset.opt];answerQuiz(val===w.tr,val);return}
  const a=t.closest("[data-act]");if(!a)return;
  const act=a.dataset.act;
  if(act==="qnext")nextQuiz();
  else if(act==="qend"){q.active=false;q.ids=q.ids.slice(0,Math.max(1,q.i+(q.answered?1:0)));renderPractice()}
  else if(act==="qagain"){const mode=q.mode;S.quiz=null;startQuiz(mode)}
  else if(act==="qmodes"){S.quiz=null;renderPractice()}
});
$("#view-practice").addEventListener("submit",e=>{if(e.target.id==="qform"){e.preventDefault();checkTyped()}});

function plWrite(op,coll,id,data){
  plQ=plQ.then(async()=>{
    try{
      if(P.db){
        const ref=P.db.collection(coll).doc(id);
        if(op==="set")await ref.set(data);else if(op==="update")await ref.update(data);else await ref.delete();
      }else{
        const L=P[coll],i=L.findIndex(x=>x.id===id);
        if(op==="set"){const o=Object.assign({id},data);if(i>=0)L[i]=o;else L.push(o)}
        else if(op==="update"&&i>=0)L[i]=Object.assign({},L[i],data);
        else if(op==="delete"&&i>=0)L.splice(i,1);
        plSaveLocal();renderPlan();
      }
    }catch(e){toast(e&&e.code==="quota_exceeded"?"Хранилище заполнено":"Не удалось сохранить, попробуйте ещё раз")}
  });
  return plQ;
}

/* ---------- planning: derived ---------- */
const goalPct=g=>{
  if(g.done)return 100;
  if(g.mode==="count")return g.target>0?Math.min(100,Math.round((g.current||0)/g.target*100)):0;
  const n=(g.steps||[]).length;return n?Math.round(g.steps.filter(s=>s.done).length/n*100):0;
};
const logSet=h=>new Set(h.log||[]);
function streak(h){
  const L=logSet(h);let d=new Date(),n=0;
  if(!L.has(iso(d)))d.setDate(d.getDate()-1);
  while(L.has(iso(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
const itemsOn=date=>P.items.filter(i=>i.date===date).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")||(a.created||0)-(b.created||0));
const deadlinesOn=date=>P.goals.filter(g=>!g.done&&g.due===date);
function todayStats(){

  const total=its.length+hs.length,done=its.filter(i=>i.done).length+hs.filter(h=>logSet(h).has(t)).length;

}

async function saveGoalForm(){
  const v=id=>$(id).value.trim(),mode=$("#g-mode").value;
  const title=v("#g-title");
  if(!title){toast("Назовите цель");$("#g-title").focus();return}
  const base={title,area:$("#g-area").value,due:$("#g-due").value,mode,note:v("#g-note")};
  const old=P.form.id?P.goals.find(x=>x.id===P.form.id):null;
  if(mode==="count"){
    const target=Number(v("#g-target")),cur=Number(v("#g-current")||0);
    if(!(target>0)){toast("Укажите число, к которому идёте");$("#g-target").focus();return}
    Object.assign(base,{target,current:Math.max(0,cur),unit:v("#g-unit"),steps:[]});
  }else{
    const prev=new Map(((old&&old.steps)||[]).map(s=>[s.t,s.done]));
    base.steps=v("#g-stepsText").split("\n").map(s=>s.trim()).filter(Boolean).map(t=>({t,done:!!prev.get(t)}));
    Object.assign(base,{target:0,current:0,unit:""});
  }
  if(old){const o=Object.assign({},old,base);delete o.sample;await plPut("goals",o)}
  else await plPut("goals",Object.assign({id:newId(),done:false,created:Date.now()},base));
  const edit=!!P.form.id;closeGoalForm();toast(edit?"Цель обновлена":"Цель добавлена");
}

  const t=e.target;
  const tab=t.closest("[data-ptab]");if(tab){P.form=null;P.formShown=false;setPTab(tab.dataset.ptab);return}
  const go=t.closest("[data-ptab-go]");if(go){setPTab(go.dataset.ptabGo);return}

  const b=t.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  const item=()=>P.items.find(x=>x.id===id),goal=()=>P.goals.find(x=>x.id===id),hab=()=>P.habits.find(x=>x.id===id);
  switch(act){
    case"tdone":{const i=item();if(i)plPatch("items",id,{done:!i.done});break}
    case"ditem":askDel("i"+id);break;
    case"ditemok":P.delc="";plDel("items",id);break;
    case"hday":{const h=hab();if(!h)break;const s=new Set(h.log||[]),d=b.dataset.d;if(s.has(d))s.delete(d);else s.add(d);plPatch("habits",id,{log:Array.from(s).sort().slice(-400)});break}
    case"dhab":askDel("h"+id);break;
    case"dhabok":P.delc="";plDel("habits",id);break;
    case"dgoal":askDel("g"+id);break;
    case"dgoalok":P.delc="";plDel("goals",id);break;
    case"gplus":case"gminus":{const g=goal();if(!g)break;const c=Math.max(0,(g.current||0)+(act==="gplus"?1:-1));plPatch("goals",id,{current:c,done:g.target>0&&c>=g.target?g.done:g.done});break}
    case"gstep":{const g=goal();if(!g)break;const st=(g.steps||[]).map((s,i)=>i===+b.dataset.i?{t:s.t,done:!s.done}:s);plPatch("goals",id,{steps:st});break}
    case"gdone":{const g=goal();if(g){plPatch("goals",id,{done:!g.done});toast(g.done?"Цель снова в работе":"Цель достигнута")}break}
    case"gedit":openGoalForm(id);break;
    case"gnew":openGoalForm(null);break;
    case"gcancel":closeGoalForm();break;
    case"mprev":{const m=P.month;P.month=m.m===0?{y:m.y-1,m:11}:{y:m.y,m:m.m-1};renderPlan();break}
    case"mnext":{const m=P.month;P.month=m.m===11?{y:m.y+1,m:0}:{y:m.y,m:m.m+1};renderPlan();break}
    case"mtoday":{const n=new Date();P.month={y:n.getFullYear(),m:n.getMonth()};P.sel=today();renderPlan();break}
    case"rmsamples":{
      let n=0;PLC.forEach(c=>P[c].filter(x=>x.sample).forEach(x=>{n++;plDel(c,x.id)}));
      toast(n?"Примеры убраны":"Примеров нет");break}
  }
});

function richHtml(text){
  const out=[];let list=null;
  const close=()=>{if(list){out.push("</"+list+">");list=null}};
  String(text||"").split("\n").forEach(raw=>{
    const l=raw.trimEnd();let m;
    if(!l.trim()){close();return}
    if((m=l.match(/^#{1,3}\s+(.*)$/))){close();out.push("<h4>"+esc(m[1])+"</h4>")}
    else if((m=l.match(/^\s*[-•—]\s+(.*)$/))){if(list!=="ul"){close();out.push("<ul>");list="ul"}out.push("<li>"+esc(m[1])+"</li>")}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){if(list!=="ol"){close();out.push("<ol>");list="ol"}out.push("<li>"+esc(m[1])+"</li>")}
    else{close();out.push("<p>"+esc(l)+"</p>")}
  });
  close();return out.join("");
}

  const q=norm(N.q);
  const items=N.notes.filter(n=>(!N.tag||noteTags(n).includes(N.tag))&&(!q||norm(n.title).includes(q)||norm(n.body).includes(q)||norm(noteTags(n).join(" ")).includes(q)||norm(KIND_NAME[n.kind]||"").includes(q)))
    .sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.updated||0)-(a.updated||0));
  if(!items.length){
    list.innerHTML='<div class="panel empty" style="grid-column:1/-1"><h3>'+(N.notes.length?"Ничего не найдено":"Заметок пока нет")+'</h3><p>'+(N.notes.length?"Попробуйте другой запрос или метку.":"Создайте первую заметку или вставьте текст в «Умную заметку».")+'</p></div>';return;
  }
  list.innerHTML=items.map(n=>{
    const tg=noteTags(n);
    return '<article class="panel note" data-open="'+n.id+'" tabindex="0" role="button" aria-label="Открыть заметку «'+esc(n.title||"Без названия")+'»">'+
    (n.photo?'<img class="ncover" data-blob loading="lazy" src="/_blob/'+esc(n.photo)+'" alt="">':"")+
    '<div class="nt"><h3>'+esc(n.title||"Без названия")+'</h3><button type="button" class="pinbtn" data-act="npin" data-id="'+n.id+'" aria-pressed="'+!!n.pinned+'" aria-label="'+(n.pinned?"Открепить":"Закрепить")+'"><svg class="ic" aria-hidden="true"><use href="#i-spark"/></svg></button></div>'+
    (n.kind&&KIND_NAME[n.kind]?'<div><span class="area '+(KIND_CLS[n.kind]||"a-home")+'">'+KIND_NAME[n.kind]+'</span></div>':"")+
    '<div class="nb">'+esc(n.body?plainText(n.body):"Пустая заметка")+'</div>'+
    (tg.length?'<div class="ntags">'+tg.slice(0,5).map(t=>'<span>#'+esc(t)+'</span>').join("")+'</div>':"")+
    '<div class="nf"><span>'+(n.sample?'<span class="tag-ex">пример</span>':"")+'</span><span>'+noteDate(n)+'</span></div></article>';
  }).join("");
  $$("img[data-blob]",list).forEach(i=>i.addEventListener("error",()=>i.remove(),{once:true}));
}

/* smart note generation */
const GEN_HINTS={
  recipe:'Первая строка "Время: … · Порций: …", затем разделы "## Ингредиенты" (список), "## Приготовление" (нумерованные шаги), "## Советы".',
  skill:'Разделы "## Что это", "## Зачем нужно", "## Как тренировать" (нумерованные шаги), "## Частые ошибки" (список).',
  book:'Разделы "## Главная мысль", "## Ключевые идеи" (список), "## Как применить" (список).',
  idea:'Разделы "## Суть", "## Почему это важно", "## Первые шаги" (нумерованные шаги).',
  note:'Короткое аккуратное оформление с подходящими разделами.'
};
function buildGenPrompt(text,kind){
  const kindLine=kind==="auto"?'Тип выбери сам из: recipe, skill, book, idea, note.':'Тип заметки: '+kind+'.';
  const hints=kind==="auto"?Object.keys(GEN_HINTS).map(k=>k+': '+GEN_HINTS[k]).join("\n"):kind+': '+GEN_HINTS[kind];
  return 'Ты помощник личной базы знаний. Преврати материал пользователя в аккуратную заметку на русском языке.\n'+kindLine+'\n'+
  'Правила:\n- Опирайся на текст пользователя. Не придумывай цитаты, цифры и факты, которых в нём нет. Если дана только тема, напиши краткое практичное содержание из общих знаний.\n'+
  '- Поле body это простой текст. Заголовки разделов начинаются с "## ", пункты списка с "- ", шаги с "1. ", "2. ". Без markdown-разметки кроме этого.\n'+
  '- Структура по типу:\n'+hints+'\n- Объём до 250 слов, без воды.\n'+
  '- tags: от 3 до 6 коротких русских меток в нижнем регистре, без решётки.\n- photoQuery: 2-5 английских слов для поиска красивого фото к заметке.\n'+
  'Ответь только одним JSON-объектом: {"kind":"recipe|skill|book|idea|note","title":"...","body":"...","tags":["..."],"photoQuery":"..."}\n\n'+
  'Материал пользователя:\n"""\n'+text.slice(0,12000)+'\n"""';
}
function normalizeGen(d){
  if(!d||typeof d!=="object"||typeof d.title!=="string"||typeof d.body!=="string"||!d.body.trim())throw{code:"invalid_json"};
  const kind=KIND_NAME[d.kind]?d.kind:"note";
  const tags=parseTags(Array.isArray(d.tags)?d.tags.join(","):"");
  return{title:d.title.trim().slice(0,120),body:d.body.trim(),kind,tags,photoQuery:String(d.photoQuery||"").trim().slice(0,80)};
}
const STOP=new Set("который которая которые когда чтобы потому очень можно нужно будет также этого этот эта эти того если только после перед между через около свои своих всего более менее есть было были быть или либо пока тоже даже ещё уже".split(" "));
function topWords(t,n){
  const c={};(t.toLowerCase().match(/[a-zа-яё]{5,}/g)||[]).forEach(w=>{if(!STOP.has(w))c[w]=(c[w]||0)+1});
  return Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,n);
}
function guessKind(t){
  const s=t.toLowerCase();
  if(/ингредиент|рецепт|\bмл\b|\bгр?\b|духовк|сковород|замес/.test(s))return"recipe";
  if(/навык|умение|тренир|практик/.test(s))return"skill";
  if(/книг|автор|глава|цитат/.test(s))return"book";
  return"note";
}
function localSmart(text,kind){
  const t=text.trim(),lines=t.split("\n").map(x=>x.trim()).filter(Boolean);
  let title=(lines[0]||"Новая заметка").replace(/^#+\s*/,"");if(title.length>70)title=title.slice(0,67)+"…";
  const k=kind==="auto"?guessKind(t):kind;
  const rest=lines.length>1?lines.slice(1).join("\n"):t;
  const heads={recipe:["Ингредиенты","Приготовление","Советы"],skill:["Что это","Как тренировать","Частые ошибки"],book:["Главная мысль","Ключевые идеи","Как применить"],idea:["Суть","Первые шаги"],note:[]}[k]||[];
  const body=heads.length?"## "+heads[0]+"\n"+rest+"\n\n"+heads.slice(1).map(h=>"## "+h+"\n- ").join("\n\n"):rest;
  return{title,body,kind:k,tags:topWords(t,4),photoQuery:title};
}
function setGenBusy(b,msg){
  const s=$("#gSubmit"),st=$("#gStop"),el=$("#nGenStatus");if(!s)return;
  s.disabled=b;$("#gLocal").disabled=b;st.hidden=!b;
  if(msg!==undefined){el.className="nstatus";el.textContent=msg}
}
function genError(err){
  const c=err&&err.code,el=$("#nGenStatus");if(!el)return;
  if(c==="cancelled"){el.textContent="Остановлено.";return}
  el.className="nstatus err";
  el.textContent={
    not_granted:"Доступ к Claude не разрешён. Разрешите его или оформите по шаблону.",
    sampling_disabled:"Claude недоступен для этого аккаунта. Оформите по шаблону.",
    rate_limited:"Слишком много запросов. Подождите немного и попробуйте снова.",
    session_expired:"Нужно заново войти в аккаунт.",
    invalid_json:"Не удалось разобрать ответ. Нажмите «Создать» ещё раз или сократите текст.",
    prompt_too_large:"Текст слишком длинный. Вставьте его по частям.",
    refused:"Claude не смог обработать этот текст. Измените его и попробуйте снова."
  }[c]||"Не получилось создать заметку. Попробуйте ещё раз.";
}
async function finishGen(d){
  const id=newId(),now=Date.now();
  const doc={title:d.title,body:d.body,kind:d.kind,tags:d.tags,photo:"",photoQuery:d.photoQuery,smart:d.smart!==false,pinned:false,created:now,updated:now};
  await nWrite("set",id,doc);
  $("#nGen").hidden=true;$("#ngenform").reset();
  openNote(id,Object.assign({id},doc));
  toast(doc.smart?"Заметка создана. Её можно править":"Заметка оформлена по шаблону");
}
async function runGen(){
  const text=$("#g-text").value.trim();
  if(!text){toast("Вставьте текст или тему");$("#g-text").focus();return}
  const kind=$("#g-kind").value;
  setGenBusy(true,"Создаю заметку… это может занять до минуты");
  let sample=null;
  try{sample=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(e){sample=null}
  if(!sample){setGenBusy(false,"");const el=$("#nGenStatus");el.className="nstatus err";el.textContent="Генерация с Claude работает на странице, открытой по ссылке в Claude. Здесь можно оформить текст по шаблону.";return}
  N.genCtl=new AbortController();
  try{
    const data=await sample.json(buildGenPrompt(text,kind),{signal:N.genCtl.signal,cache:false});
    await finishGen(normalizeGen(data));
  }catch(err){genError(err)}
  finally{N.genCtl=null;setGenBusy(false)}
}
function runLocal(){
  const text=$("#g-text").value.trim();
  if(!text){toast("Вставьте текст или тему");$("#g-text").focus();return}
  finishGen(Object.assign(localSmart(text,$("#g-kind").value),{smart:false}));
}
function openGen(){
  if(N.editing&&N.dirty)saveNote(false);
  N.editing=null;N.dirty=false;const ed=$("#nEditor");ed.hidden=true;ed.innerHTML="";
  const g=$("#nGen");g.hidden=false;setGenBusy(false,"");
  g.scrollIntoView({behavior:"smooth",block:"nearest"});$("#g-text").focus({preventScroll:true});
}

/* editor */
function setNStatus(k){
  const el=$("#nStatus");if(!el)return;
  const t=new Date(),hm=pad(t.getHours())+":"+pad(t.getMinutes());
  el.className="nstatus"+(k==="err"?" err":"");
  el.textContent={dirty:"Есть несохранённые изменения",saving:"Сохраняю…",saved:"Сохранено · "+hm,err:"Не сохранено",idle:""}[k]||"";
}
function photoQuery(){
  const e=N.editing,t=$("#n-title"),g=$("#n-tags");
  return(e&&e.photoQuery)||(t&&t.value.trim())||(g&&parseTags(g.value).join(" "))||"красивое фото";
}
function renderPhotoBlock(){
  const e=N.editing,box=$("#nPhoto");if(!e||!box)return;
  box.innerHTML=
    '<div class="nph-img">'+(e.photo?'<img data-blob src="/_blob/'+esc(e.photo)+'" alt="Фото к заметке">':'<span>Фото к заметке</span>')+'</div>'+
    '<div class="nph-side"><div class="tag-ex">Фото</div><div class="nph-btns">'+
    (S.assets?'<label class="filebtn"><input type="file" id="n-photo" accept="image/png,image/jpeg,image/webp,image/gif">'+(e.photo?"Заменить фото":"+ Загрузить фото")+'</label>':"")+
    '<a class="btn ghost small" id="nPhLink" href="'+photoUrl(photoQuery())+'" target="_blank" rel="noopener">Найти фото в Pinterest</a>'+
    (e.photo?'<button type="button" class="btn ghost small" data-act="nphrm">Убрать</button>':"")+'</div>'+
    '<small>'+(S.assets?"Найдите картинку, сохраните её и загрузите сюда. Скопированную картинку можно вставить через Ctrl+V.":"Загрузка фото доступна на странице, открытой по ссылке в Claude.")+'</small></div>';
  $$("img[data-blob]",box).forEach(i=>i.addEventListener("error",()=>{i.replaceWith(Object.assign(document.createElement("span"),{textContent:"Фото не загрузилось"}))},{once:true}));
}
function openNote(id,fb){
  const n=id?(N.notes.find(x=>x.id===id)||fb||null):null;
  if(id&&!n)return;
  N.editing=n?{id:n.id,isNew:false,created:n.created||Date.now(),pinned:!!n.pinned,photo:n.photo||"",photoQuery:n.photoQuery||"",smart:!!n.smart}
    :{id:newId(),isNew:true,created:Date.now(),pinned:false,photo:"",photoQuery:"",smart:false};
  N.dirty=false;N.delc="";
  $("#nGen").hidden=true;
  const d=n||{title:"",body:"",kind:"note"},tags=n?noteTags(n):[];
  const p=$("#nEditor");p.hidden=false;
  p.innerHTML='<form class="form" id="nform" novalidate><div class="nhead"><h2 style="font-size:32px">'+(n?"Изменить заметку":"Новая заметка")+(N.editing.smart?' <span class="tag-ex">создано с ИИ, проверьте детали</span>':"")+'</h2><span class="nstatus" id="nStatus" role="status"></span></div>'+
    '<div class="row"><label>Заголовок<input type="text" id="n-title" value="'+esc(d.title)+'" autocomplete="off"></label>'+
    '<label>Тип<select id="n-kind">'+Object.keys(KIND_NAME).map(k=>'<option value="'+k+'"'+((d.kind||"note")===k?" selected":"")+'>'+KIND_NAME[k]+'</option>').join("")+'</select></label></div>'+
    '<label>Теги через запятую<input type="text" id="n-tags" list="n-tagsdl" value="'+esc(tags.join(", "))+'" placeholder="например: рецепты, завтрак" autocomplete="off"><datalist id="n-tagsdl"></datalist></label>'+
    '<div class="nphoto" id="nPhoto"></div>'+
    '<div><div class="nhead" style="margin-bottom:6px"><span class="tag-ex">Текст</span><button type="button" class="linkbtn" data-act="nview">Показать оформление</button></div>'+
    '<textarea id="n-body" rows="12" aria-label="Текст заметки">'+esc(d.body)+'</textarea><div class="rich" id="nView" hidden></div></div>'+
    '<div class="actions"><button type="submit" class="btn">Сохранить</button>'+
    '<button type="button" class="btn ghost" data-act="npinned" aria-pressed="'+N.editing.pinned+'">'+(N.editing.pinned?"Закреплена":"Закрепить")+'</button>'+
    '<button type="button" class="btn ghost" data-act="nclose">Закрыть</button>'+
    (n?'<button type="button" class="btn ghost grow" data-act="ndel">Удалить</button>':"")+'</div></form>';
  renderPhotoBlock();renderNotes();
  p.scrollIntoView({behavior:"smooth",block:"nearest"});
  const f=$(n?"#n-body":"#n-title");if(f)f.focus({preventScroll:true});
}
async function saveNote(manual){
  const e=N.editing;if(!e||!$("#nform"))return;
  clearTimeout(N.timer);
  const title=$("#n-title").value.trim(),body=$("#n-body").value;
  if(!title&&!body.trim()&&e.isNew){if(manual)toast("Заметка пустая");return}
  const doc={title,body,kind:$("#n-kind").value,tags:parseTags($("#n-tags").value),photo:e.photo||"",photoQuery:e.photoQuery||"",smart:!!e.smart,pinned:!!e.pinned,created:e.created,updated:Date.now()};
  setNStatus("saving");N.dirty=false;
  await nWrite("set",e.id,doc);
  e.isNew=false;
  const st=$("#nStatus");if(st&&st.className.indexOf("err")<0)setNStatus("saved");
  if(manual)toast("Заметка сохранена");
}
async function closeNote(){
  if(N.editing&&N.dirty)await saveNote(false);
  N.editing=null;N.dirty=false;N.delc="";
  const p=$("#nEditor");p.hidden=true;p.innerHTML="";renderNotes();
}
function nDirty(){
  N.dirty=true;setNStatus("dirty");
  clearTimeout(N.timer);N.timer=setTimeout(()=>saveNote(false),900);
}
async function uploadPhoto(file){
  if(!S.assets||!N.editing){toast("Загрузка фото доступна на странице в Claude");return}
  if(!file||!/^image\//.test(file.type)){toast("Выберите картинку");return}
  toast("Загружаю фото…");
  try{const r=await S.assets.upload(file);N.editing.photo=r.id;renderPhotoBlock();nDirty()}
  catch(err){toast(err&&err.code==="too_large"?"Файл больше 20 МБ":err&&err.code==="unsupported_type"?"Нужен JPG, PNG или WebP":"Не удалось загрузить фото")}
}
(function bindNotes(){
  const root=$("#sec-notes");
  root.addEventListener("click",async e=>{
    const t=e.target;
    const tg=t.closest("[data-ntag]");if(tg){N.tag=tg.dataset.ntag;renderNotes();return}
    const b=t.closest("[data-act]");
    if(b){
      const act=b.dataset.act;
      if(act==="nnew"){if(N.editing&&N.dirty)await saveNote(false);$("#nGen").hidden=true;openNote(null)}
      else if(act==="ngen")openGen();
      else if(act==="ngencancel"){if(N.genCtl)N.genCtl.abort();$("#nGen").hidden=true}
      else if(act==="ngenstop"){if(N.genCtl)N.genCtl.abort()}
      else if(act==="ngenlocal")runLocal();
      else if(act==="npin"){const n=N.notes.find(x=>x.id===b.dataset.id);if(n){const o=Object.assign({},n,{pinned:!n.pinned});delete o.id;await nWrite("set",n.id,o)}}
      else if(act==="npinned"&&N.editing){N.editing.pinned=!N.editing.pinned;b.setAttribute("aria-pressed",String(N.editing.pinned));b.textContent=N.editing.pinned?"Закреплена":"Закрепить";nDirty()}
      else if(act==="nphrm"&&N.editing){N.editing.photo="";renderPhotoBlock();nDirty()}
      else if(act==="nview"){
        const v=$("#nView"),ta=$("#n-body"),on=v.hidden;
        v.hidden=!on;ta.hidden=on;if(on)v.innerHTML=richHtml(ta.value)||"<p>Пока пусто</p>";
        b.textContent=on?"Править текст":"Показать оформление";
      }
      else if(act==="nclose")closeNote();
      else if(act==="ndel"&&N.editing){
        if(!N.delc){N.delc="1";b.textContent="Удалить насовсем";setTimeout(()=>{N.delc="";if(b.isConnected)b.textContent="Удалить"},4000)}
        else{const id=N.editing.id;clearTimeout(N.timer);N.editing=null;N.dirty=false;$("#nEditor").hidden=true;$("#nEditor").innerHTML="";await nWrite("del",id);toast("Заметка удалена")}
      }
      return;
    }
    const card=t.closest("[data-open]");
    if(card){if(N.editing&&N.dirty)await saveNote(false);openNote(card.dataset.open)}
  });
  root.addEventListener("keydown",e=>{
    const card=e.target.closest&&e.target.closest("[data-open]");
    if(card&&e.target===card&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openNote(card.dataset.open)}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"&&$("#nform")){e.preventDefault();saveNote(true)}
    if(e.key==="Escape"&&$("#nform")&&e.target.closest("#nform"))closeNote();
  });
  root.addEventListener("input",e=>{
    if(e.target.id==="nq"){N.q=e.target.value;renderNotes();return}
    if(e.target.closest&&e.target.closest("#nform")){
      nDirty();
      if(e.target.id==="n-title"||e.target.id==="n-tags"){const a=$("#nPhLink");if(a)a.href=photoUrl(photoQuery())}
    }
  });
  root.addEventListener("change",e=>{
    if(e.target.id==="n-photo"){const f=e.target.files&&e.target.files[0];if(f)uploadPhoto(f)}
  });
  root.addEventListener("paste",e=>{
    if(!N.editing||!e.clipboardData)return;
    const f=Array.from(e.clipboardData.files||[]).find(x=>/^image\//.test(x.type));
    if(f){e.preventDefault();uploadPhoto(f)}
  });
  root.addEventListener("submit",e=>{
    e.preventDefault();
    if(e.target.id==="nform")saveNote(true);
    else if(e.target.id==="ngenform")runGen();
  });
})();

/* ---------- boot ---------- */
$$(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
$$("[data-tab]").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
drawSky();renderHero();renderWords();
initStore();
initPlan();
initNotes();
bindSections();
})();
